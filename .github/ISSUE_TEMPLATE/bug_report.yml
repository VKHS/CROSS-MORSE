name: Bug report
description: Report a reproducible implementation or tooling defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the smallest example that reproduces the defect. For questions
        about manuscript values or experiment interpretation, use Reproduction question.
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      options:
        - ogbn-arxiv
        - ogbn-products
        - ogbn-proteins
        - Roman-empire
        - PascalVOC-SP
        - COCO-SP
        - Peptides-func
        - Synthetic fixture or source tooling
  - type: input
    id: version
    attributes:
      label: Source identity
      description: Include the commit or run source SHA when available.
      placeholder: "Commit hash or source_sha256 from the run manifest"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Dataset or preprocessing
        - Training or exploration
        - Controller fitting or policy execution
        - Selection, confirmation or admission
        - Evaluation or evidence replay
        - Slurm, packaging or installation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and configuration
      description: Give a minimal command and the config/profile used. Remove private credentials and allocation details from pasted logs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior
      description: Include the error message or the smallest differing result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, OS, CPU/GPU, precision and relevant package versions.
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or artifact identities
      description: A short traceback, source/config hash or public artifact link is helpful.
