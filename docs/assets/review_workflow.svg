<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="788" viewBox="0 0 1080 788" role="img" aria-labelledby="title desc">
<title id="title">From a sealed run to reviewable evidence</title>
<desc id="desc">A completed run records resolved settings, stage manifests, numeric observations, policy decisions and checkpoint identities. Three review paths check different objects: numeric replay recomputes decisions from saved observations; checkpoint replay recomputes predictions from trusted frozen weights and the prepared graph; a portable review bundle checks numeric evidence without shipping weights or prepared data. New official-data experiments and manuscript registry values retain separate provenance. Record consistency alone does not establish original experiment chronology.</desc>
<metadata id="diagram-contract">{"checkpoint_replay_requires": ["prepared_graph", "trusted_checkpoints"], "kind": "evidence_artifacts", "numeric_replay_runs_predictor": false, "original_chronology_authenticated": false, "portable_bundle_includes_checkpoints": false}</metadata>
