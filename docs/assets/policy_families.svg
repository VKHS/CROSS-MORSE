<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="834" viewBox="0 0 1080 834" role="img" aria-labelledby="title desc">
<title id="title">Nine routes and their information contracts</title>
<desc id="desc">Six open-loop families commit a schedule or stopping depth using development data and, where declared, the initial input. Three feedback families repeatedly use the current label-free state. MPC-OL plans once and completes with nominal transport; MPC-RH replans and executes one action. Selection chooses the strongest registered open-loop comparator before comparing feedback. Confirmation and admission can return that comparator. This diagram contains no measured route outcomes.</desc>
<metadata id="diagram-contract">{"MPC_OL": {"A9_allowed": false, "intermediate_observations_change_plan": false, "replans": false, "tail": "nominal"}, "MPC_RH": {"executes": "first_action", "replans": true}, "contains_measured_results": false, "feedback": ["One-step", "Radius", "MPC-RH"], "kind": "policy_information", "open_loop": ["Nominal", "Best depth", "Learned stop", "Phase schedule", "Fixed sequence", "MPC-OL"]}</metadata>
